
<!DOCTYPE html>


<html>
<head>
    <title>Simple Calculator</title>

    <style>
        body {
            background: #111;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calculator {
            background: #222;
            padding: 25px;
            border-radius: 15px;
            width: 300px;
            box-shadow: 0 0 20px #b8860b;
        }

        h2 {
            color: gold;
            text-align: center;
        }

        input {
            width: 100%;
            height: 55px;
            background: black;
            color: gold;
            font-size: 25px;
            text-align: right;
            border: 1px solid gold;
            border-radius: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
            padding: 10px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 55px;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #b8860b;
            color: black;
        }

        .operator {
            color: gold;
        }

        .clear {
            background: #b8860b;
            color: black;
        }

        .equal {
            background: gold;
            color: black;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h2>My Calculator</h2>

        <input type="text" id="display" readonly>

        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">AC</button>
            <button onclick="deleteLast()">DEL</button>
            <button class="operator" onclick="appendValue('%')">%</button>
            <button class="operator" onclick="appendValue('/')">÷</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">-</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('00')">00</button>
            <button onclick="appendValue('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>

        </div>

    </div>

    <script>

        let display = document.getElementById("display");

        // Value display mein add karna
        function appendValue(value) {
            display.value += value;
        }

        // Pura display clear karna
        function clearDisplay() {
            display.value = "";
        }

        // Last character delete karna
        function deleteLast() {
            display.value = display.value.slice(0, -1);
        }

        // Calculation perform karna
        function calculate() {
            try {
                let expression = display.value;

                if (expression === "") {
                    return;
                }

                // Sirf valid calculator characters allow honge
                if (!/^[0-9+\-*/%.() ]+$/.test(expression)) {
                    throw new Error("Invalid");
                }

                let result = Function(
                    '"use strict"; return (' + expression + ')'
                )();

                if (!Number.isFinite(result)) {
                    throw new Error("Invalid");
                }

                display.value = Number(result.toFixed(10));

            } catch (error) {
                display.value = "Error";
            }
        }

    </script>

</body>
</html>
