
<!DOCTYPE html>
<html>
<head>
    <title>Counter Application</title>

    <style>
        body {
            background: #111;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: #222;
            padding: 35px;
            width: 300px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 0 15px gold;
        }

        h1 {
            color: gold;
        }

        #count {
            font-size: 55px;
            color: white;
            margin: 25px;
        }

        button {
            padding: 12px 18px;
            margin: 5px;
            border: none;
            border-radius: 7px;
            font-size: 18px;
            cursor: pointer;
            background: gold;
            color: black;
        }

        button:hover {
            background: #b8860b;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Counter App</h1>

        <h2 id="count">0</h2>

        <button onclick="decrement()">-</button>

        <button onclick="reset()">Reset</button>

        <button onclick="increment()">+</button>

    </div>

    <script>

        let count = 0;

        let display = document.getElementById("count");

        // Increment counter
        function increment() {
            count++;
            display.innerText = count;
        }

        // Decrement counter
        function decrement() {
            if (count > 0) {
                count--;
                display.innerText = count;
            }
        }

        // Reset counter
        function reset() {
            count = 0;
            display.innerText = count;
        }

    </script>

</body>
</html>
